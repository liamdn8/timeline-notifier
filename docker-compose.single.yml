services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/timeline_notifier
      MEDIA_DIR: /app/media
      STATIC_DIR: /app/public
      AUDIO_S3_ENABLED: ${AUDIO_S3_ENABLED:-false}
      AUDIO_S3_BUCKET: ${AUDIO_S3_BUCKET:-}
      AUDIO_S3_PREFIX: ${AUDIO_S3_PREFIX:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - media-data:/app/media
    ports:
      - "8080:3001"

volumes:
  mongo-data:
  media-data:
